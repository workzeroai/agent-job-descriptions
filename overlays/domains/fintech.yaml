core_adjustments:
  compliance_and_guardrails:
    - "Strict financial advertising compliance (금융소비자보호법, 공정거래법, 표시광고법, SEC/FINRA rules)."
    - "Zero-tolerance on unverified yield/return claims or misleading fee statements in ad copy and influencer briefs."
