    - "Focus on KYC/KYB completion rate, first transaction activation, LTV/CAC, fraud/chargeback rate, and trust equity."
  agent_tool_adjustments:
    - "Add mandatory Legal/Compliance Critic pass before any paid ad, CRM trigger, or PR statement goes live."
